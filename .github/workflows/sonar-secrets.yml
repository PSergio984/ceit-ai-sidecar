name: SonarQube secrets scan

on:
  push:
  pull_request:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SonarQube CLI
        # Vendored from SonarSource/sonarqube-cli@baec4e3d50af474dcae409eea01e4d8301061953
        # (user-scripts/install.sh) and committed to .github/scripts/ so the
        # executed artifact is fully auditable — nothing downloaded at runtime.
        run: bash .github/scripts/sonarqube-install.sh
      - name: Scan for secrets
        env:
          SONARQUBE_CLI_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONARQUBE_CLI_ORG: psergio984
        run: |
          export PATH="$HOME/.local/share/sonarqube-cli/bin:$PATH"
          sonar analyze secrets .
