name: SonarCloud quality gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # pg_index coverage: the Postgres tests must run in the job that
      # produces coverage.xml or the new code reports 0% to the gate.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --frozen --group offline
      - name: Test with coverage
        env:
          SIDECAR_TOKEN: ci-test-token
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          uv run pytest --cov=app --cov-report=xml
      - name: SonarCloud Scan
        # sonarcloud-github-action is archived; the maintained replacement is
        # sonarqube-scan-action (pinned to the v8.2.1 commit).
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reuses the org-level token from the secrets-scan workflow. If this
          # token lacks SonarCloud quality-scan scope, add a dedicated
          # SONAR_TOKEN secret and reference it here instead.
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
