[project]
name = "ceit-ai-sidecar"
version = "0.1.0"
description = "Hybrid search sidecar for CEIT-Library AI assistant (FTS5 BM25 + English semantic + RRF fusion)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "sentence-transformers>=5.7,<5.8",
    "sqlitesearch>=0.3,<0.4",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "numpy>=2.0",
    "openai>=2.45,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
